<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dice'n'Roll</title>
    <meta name="theme-color" content="#EAF4FB" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    />
    <script>
      // Set the theme before the first paint, so dark mode doesn't flash white on load.
      // (main.js is a module and runs after the page is drawn, which would be too late.)
      (function () {
        var theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        try {
          var saved = localStorage.getItem("dice-n-fun:theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
                // The phone's status bar matches the app's background
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0B1824" : "#EAF4FB";
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
