<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dice'n'Roll</title>
    <meta name="theme-color" content="#EAF4FB" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <!-- Link previews (Instagram, WhatsApp, Viber, Messenger, Discord, …) -->
    <meta name="description" content="Score tracker for Zonk, Yamb and Flash Yamb, played with real dice." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dice'n'Roll" />
    <meta property="og:title" content="Dice'n'Roll" />
    <meta property="og:description" content="Keep score. Roll real dice. Zonk, Yamb and Flash Yamb on one phone." />
    <meta property="og:url" content="https://bandamarko.github.io/dice-n-roll/" />
    <meta property="og:image" content="https://bandamarko.github.io/dice-n-roll/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dice'n'Roll logo with the text Keep score. Roll real dice." />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Set the theme before the first paint, so dark mode doesn't flash white on load.
      // (main.js is a module and runs after the page is drawn, which would be too late.)
      (function () {
        var theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        try {
          var saved = localStorage.getItem("dice-n-fun:theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
                // The phone's status bar matches the app's background
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0B1824" : "#EAF4FB";
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
